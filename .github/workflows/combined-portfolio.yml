name: Refresh combined portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cross-asset-macro-trend
        uses: actions/checkout@v4
        with:
          path: cross-asset-macro-trend

      - name: Checkout cross-asset-rv-monitor
        uses: actions/checkout@v4
        with:
          repository: SachinMS206/cross-asset-rv-monitor
          path: cross-asset-rv-monitor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install trend project dependencies
        run: pip install -r requirements.txt
        working-directory: cross-asset-macro-trend

      - name: Install RV monitor dependencies
        run: pip install -r requirements.txt
        working-directory: cross-asset-rv-monitor

      - name: Run trend book live, export returns
        run: python scripts/run_demo.py --live --export-returns ../trend_returns.csv
        working-directory: cross-asset-macro-trend

      - name: Run RV book live, export returns
        run: python scripts/run_monitor.py --live --export-returns ../rv_returns.csv
        working-directory: cross-asset-rv-monitor

      - name: Combine portfolios and update PORTFOLIO_CONSTRUCTION.md
        run: python scripts/combine_portfolios.py --trend-csv ../trend_returns.csv --rv-csv ../rv_returns.csv --out-doc PORTFOLIO_CONSTRUCTION.md
        working-directory: cross-asset-macro-trend

      - name: Commit and push updated results
        working-directory: cross-asset-macro-trend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PORTFOLIO_CONSTRUCTION.md
          git diff --cached --quiet || git commit -m "Refresh combined portfolio analysis"
          git push
