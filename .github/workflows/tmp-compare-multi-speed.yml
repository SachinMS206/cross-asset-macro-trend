name: TEMP - compare single vs multi-speed live results

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Single-speed live run
        run: |
          echo "===== SINGLE-SPEED ====="
          python scripts/run_demo.py --live

      - name: Multi-speed live run
        run: |
          echo "===== MULTI-SPEED ====="
          python scripts/run_demo.py --live --multi-speed
